<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transformations</title>
  <link rel="stylesheet" href="style.css" class="css">
</head>
<body>
  <div class="container">
    <section class="main-parent">
      <div class="main-parent__title">A. 2D Transformations
      </div>
        <div class="example-row">
        <div class="example-box translate">Translate</div>
        <div class="example-box rotate">Rotate</div>
        <div class="example-box scale">Scale</div>
        <div class="example-box skew">skew</div>
      </div>
    </section>


    <section class="main-parent">
      <div class="main-parent__title">B. Combined Transformations
      </div>
        <div class="example-row">
        <div class="example-box translate-rotate">Translate+Rotate</div>
        <div class="example-box scale-skew">Scale+Skew</div>
      
      </div>
    </section>

    <section class="main-parent">
      <div class="main-parent__title">C. 3D Transformations
      </div>
        <div class="example-row">
        <div class="example-box rotate-x">RotateX</div>
        <div class="example-box rotate-y">RotateY</div>
        <div class="example-box perspective">Perspective<div>
      
      </div>
    </section>


    <section class="main-parent">
      <div class="main-parent__title">D. Transformations Point
      </div>
        <div class="example-row">
        
          <div class="example-box point-center">Point Center</div>
          <div class="example-box point-left">Point Left</div>
          <div class="example-box point-right">Point Right</div>
      </div>
    </section>
    <section class="main-parent">
      <div class="main-parent__title">E. Interactive Transformations 
      </div>
        <div class="example-row">
        
          <div class="example-box hover-scale">Hover Scale</div>
          <div class="example-box hover-rotate">Hover Rotate</div>
          <div class="example-box hover-3d">Hover 3D</div>
      
    </section>
  </div>
  
</body>
</html>
