<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Header and Footer tags</title>
    <meta charset="utf-8">
<style>
  body {
  margin: 0;
  padding: 0;
  color: white;
  background-color: #2c3e50;
  min-height: auto;
}

/* Header */
.page-header {
  position: relative;
  z-index: 5;

  min-height: 20px;
  padding: 20px;

  color: white;

  background-image:
    linear-gradient(45deg, #34495e 25%, transparent 25%),
    linear-gradient(-45deg, #34495e 25%, transparent 25%),
    linear-gradient(135deg, #34495e 25%, transparent 25%),
    linear-gradient(-135deg, #34495e 25%, transparent 25%);
  background-position: 10px 0, 10px 0, 0 0, 0 0;
  background-size: 20px 20px;
  box-shadow: 0 0 5px 0 #333333;
}

/* Footer */
.page-footer {
  min-height: 50px;
  padding: 20px;

  font-size: 14px;
  color: black;

  background-color: #f1c40f;
  background-image:
    linear-gradient(45deg, transparent 50%, white 50%),
    linear-gradient(-45deg, transparent 50%, white 50%),
    linear-gradient(135deg, transparent 50%, #2c3e50 50%),
    linear-gradient(-135deg, transparent 50%, #2c3e50 50%);
  background-repeat: repeat-x;
  background-position: 0 0, 0 0, 0 100%, 0 100%;
  background-size: 12px 12px;
}

</style>
  </head>
  <body>
    <!--Add your header and footer below this comment.-->
    <header class="page-header"> Header</header>
    <footer class="page-footer"> Footer</footer>
  </body>
</html>
