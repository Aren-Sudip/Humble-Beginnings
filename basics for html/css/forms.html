<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms & Semantic html</title>
  </head>
  <body>
    <header>
      <H1>FORM APPLICATION SITE</H1>
    </header>
<hr>
    <main>
    <div>
      <form target="_blank" action="https://google.com/search" method="get">

        <p>
          <label for="search">Search with Keyword:
            <input  type="text" id="search" name="random" placeholder="Type in your query here" required>
          </label>
        </p>
        <p>
          <button type="submit">Submit your Query</button>
        </p>
      </form>

      <form action="" method="get" target="_blank">
        <p>
          <label for="name">Name:</label>
          <input type="text" id="name" required>
        </p>
        <p>
          <label for="email">Email:</label>
          <input type="email" id="email" required>
        </p>
        <p>
          <label for="phone">Phone:</label>
          <input type="tel" id="phone" required>
        </p>
        <p>
          <label for="password">Password:</label>
          <input type="password" id="password" required>
        </p>
        <p>
          <button type="submit">Submit</button>
        </p>
        <p>
          <input type="radio" id="male" name="gender" value="male"  >
          <label for="male">Male</label>
          
        </p>
        <p>
          <input type="radio" id="female" name="gender" value="female"  >
          <label for="female">Female</label>
        </p>
      </form>
    </div>
    </main>
    <hr>
    <footer>
      <p>Lorem ipsum dolor sit. copyrights @sudipsy</p>
    </footer>
  </body>
</html>
