<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Decorative Css</title>
  <link rel="stylesheet" href="style.css" class="css">
</head>
<body>
    <div class="parent-container">
  <section class="main-section">
    <h2 class="main-section__title">1.Element Shadows</h2>
    <div class="example-row">
      <div class="example-box shadow-basic">Shadow Basic</div>
      <div class="example-box shadow-blur">Shadow Blur</div>
      <div class="example-box shadow-multiple">Shadow Multiple</div>
    </div>
  </section>

  <section class="main-section">
    <h2 class="main-section__title">2.Text Shadows</h2>
    <div class="example-row">
      <div class="example-box shadow-basic-text">Shadow Basic-Text</div>
      <div class="example-box shadow-glow-text">Shadow Glow-Text</div>
      
    </div>
  </section>

   <section class="main-section">
    <h2 class="main-section__title">3.Borders Shadows</h2>
    <div class="example-row">
      <div class="example-box border-radius">border radius</div>
      <div class="example-box border-image">border image</div>
      <div class="example-box outline">outline</div>
    </div>
  </section>

  
   <section class="main-section">
    <h2 class="main-section__title">4.Filter</h2>
    <div class="example-row">
     <div class="example-box blur-filter"> blur-filter </div>
  </section>
  </section>

  
   <section class="main-section">
    <h2 class="main-section__title">5.Gradients</h2>
    <div class="example-row">
     <div class="example-box linear-gradient"> linear gradients </div>
     <div class="example-box radial-gradient"> radial gradients </div>
     <div class="example-box conic-gradient"> linear gradients </div>
  </section>

</div>
</body>
</html>
