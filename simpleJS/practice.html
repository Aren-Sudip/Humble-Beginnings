<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>practice Slider js</title>
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
/>
  <link rel="stylesheet" href="practice.css">
</head>
<body>

  <div class="swiper">
    <div class="swiper-wrapper">
      <div class="swiper-slide">1 - eins </div>
      <div class="swiper-slide">2 - zwei</div>
      <div class="swiper-slide">3 - drei </div>
      <div class="swiper-slide">4 - vier</div>
      <div class="swiper-slide">5 - fünf</div>
      <div class="swiper-slide">6 - sechs</div>
      <div class="swiper-slide">7 - sieben</div>
      <div class="swiper-slide">8 - acht</div>
      <div class="swiper-slide">9 - neun</div>
      <div class="swiper-slide">10 - zehn</div>
    </div>

    <div class="swiper-button-prev"></div>
    <div class="swiper-button-next"></div>
    </div>
    <div class="extra-buttons">
      <button class="extra go-back">Go Back</button>
      <button class="extra next-page">Next Page</button>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
  <script src="practice.js" defer></script>
</body>
</html>
