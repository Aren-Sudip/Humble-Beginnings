<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic Effects</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="parent-container">
      <section class="main-section">
        <h2 class="main-section__title">1.Element Shadows</h2>
        <div class="example-row">
         <div class="example-box transition-basic">Basic</div>
         <div class="example-box transition-delay">Delay</div>
         <div class="example-box transition-timing">Timing</div>
      </section>

      
      <section class="main-section">
        <h2 class="main-section__title">2.Css Animations</h2>
        <div class="example-row">
         <div class="example-box animation-bounce">Bounce</div>
         <div class="example-box animation-pulse">Pulse</div>
         <div class="example-box animation-spin">Spin</div>
        
      </section>


      <section class="main-section">
        <h2 class="main-section__title">3.Css Style Animations</h2>
        <div class="example-row">
         <div class="example-box opacity-transition ">Opacity</div>
         <div class="example-box color-transition ">Color</div>
         <div class="example-box size-transition ">Size</div>
       
        
      </section>
    </div>
  </body>
</html>
